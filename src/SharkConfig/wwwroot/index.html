<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>SharkConfig</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="rail">
      <div class="device" id="device"></div>
      <nav class="nav" id="nav" aria-label="Seções"></nav>
      <div class="rail-foot" id="rail-foot"></div>
    </aside>

    <main class="main">
      <header class="head">
        <div>
          <h1 id="title"></h1>
          <p id="subtitle"></p>
        </div>
        <div class="progress" id="progress"><i></i></div>
      </header>
      <section class="view" id="view"></section>

      <div class="changes" id="changes" role="status" inert>
        <span id="changes-text"></span>
        <button class="btn plain" id="discard">Descartar</button>
        <button class="btn accent" id="apply">Aplicar no mouse</button>
      </div>
    </main>
  </div>

  <div class="modal" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <h2 id="sheet-title">Aplicar no mouse</h2>
      <p id="sheet-text"></p>
      <details class="packets"><summary>Ver pacotes</summary><pre id="sheet-packets"></pre></details>
      <div class="sheet-actions">
        <button class="btn" id="sheet-cancel">Cancelar</button>
        <button class="btn accent" id="sheet-confirm">Aplicar</button>
      </div>
    </div>
  </div>

  <div class="modal" id="settings" hidden>
    <div class="sheet small" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title">Aparência</h2>
      <div class="group"><h3>Tema</h3>
        <div class="seg" id="theme-seg">
          <button data-theme-choice="dark">Escuro</button>
          <button data-theme-choice="light">Claro</button>
        </div>
      </div>
      <div class="group"><div class="rows"><div class="row"><div class="label">Reduzir movimento</div>
        <label class="switch"><input type="checkbox" id="reduce-motion"><i></i></label></div></div></div>
      <div class="group"><h3>Sistema</h3><div class="rows"><div class="row"><div class="label">Iniciar com o Windows<span>Abre na bandeja, com a bateria do mouse no ícone</span></div>
        <label class="switch"><input type="checkbox" id="startup"><i></i></label></div></div></div>
      <div class="sheet-actions"><button class="btn accent" id="settings-done">Pronto</button></div>
    </div>
  </div>

  <div class="toast" id="toast" role="alert"></div>
  <script src="app.js"></script>
  <script src="kb.js"></script>
</body>
</html>
